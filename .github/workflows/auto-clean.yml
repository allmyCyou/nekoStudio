name: Auto Clean Workflow Runs

on:
  schedule:
    - cron: 27 19 */3 * *
  workflow_dispatch:

jobs:
  prune-history:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 3
