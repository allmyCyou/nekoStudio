[versions]
agp = "9.5.0-alpha08"
kotlin = "2.5.0-Beta1"

android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "37"

android-versionCode = "30"
android-versionPrefix = "4.8"

android-ndk-version = "30.0.16248370"
android-buildTools-version = "37.0.0"
cmake-version = "4.4.2"

kotlinxCoroutines = "1.11.0"
annotation = "1.11.0"
coreKtx = "1.19.1"
collection = "1.6.0"
window = "1.5.1"

bc = "1.86"
cye = "0.1.0"
spake2 = "2.2.1"

jdklibs = "2.1.5"
libsuVersion = "6.0.0"

hiddenapibypassVersion = "6.1"
nayukiQR = "1.8.0"
lifecycle = "2.11.0"

material3 = "1.5.0-alpha29"

okio = "3.18.2"
okhttp = "5.5.0"

zxing = "3.5.4"
annotationExperimental = "1.6.0"

compose-bom = "2026.09.00"
activity-compose = "1.13.0"

[libraries]
# AndroidX 核心基础库
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
androidx-annotation-experimental = { group = "androidx.annotation", name = "annotation-experimental", version.ref = "annotationExperimental" }
androidx-collection = { group = "androidx.collection", name = "collection", version.ref = "collection" }
androidx-window = { group = "androidx.window", name = "window", version.ref = "window" }

# Lifecycle 组件
androidx-lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-reactivestreams-ktx = { group = "androidx.lifecycle", name = "lifecycle-reactivestreams-ktx", version.ref = "lifecycle" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }

# kotlinx 协程
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-protobuf = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-protobuf", version.ref = "kotlinxCoroutines" }

lsposed-hiddenapibypass = { module = "org.lsposed.hiddenapibypass:hiddenapibypass", version.ref = "hiddenapibypassVersion" }

libsu-core = { module = "com.github.topjohnwu.libsu:core", version.ref = "libsuVersion" }
libsu-service = { module = "com.github.topjohnwu.libsu:service", version.ref = "libsuVersion" }

nayuki-qrcode = { group = "io.nayuki", name = "qrcodegen", version.ref = "nayukiQR" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }

android-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "jdklibs" }

okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

bcprov-jdk18on = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bc" }
bcpkix-jdk18on = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bc" }

ed25519-elisabeth = { module = "cafe.cryptography:ed25519-elisabeth", version.ref = "cye" }
curve25519-elisabeth = { module = "cafe.cryptography:curve25519-elisabeth", version.ref = "cye" }

# Spake2
spake2-android = { module = "com.github.MuntashirAkon.spake2-java:spake2-android", version.ref = "spake2" }

# Compose
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation"}
androidx-compose-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout"}
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation"}
androidx-compose-animation-core = { group = "androidx.compose.animation", name = "animation-core"}
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }

[bundles]
# 捆绑式引入
compose = [
    "androidx-compose-ui",
    "androidx-ui-graphics",
    "androidx-compose-material-icons-extended",
    "androidx-compose-material3",
    "androidx-activity-compose",
    "androidx-compose-foundation",
    "androidx-compose-foundation-layout",
    "androidx-compose-animation",
    "androidx-compose-animation-core"
]
compose-lifecycle = [
    "androidx-lifecycle-livedata-ktx",
    "androidx-lifecycle-viewmodel-compose",
    "androidx-lifecycle-runtime-compose",
    "androidx-lifecycle-process",
    "androidx-lifecycle-reactivestreams-ktx",
    "androidx-lifecycle-service"
]
compose-debug = [
    "androidx-compose-ui-tooling",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-ui-test-manifest"
]
kotlinx-android = [
    "kotlinx-coroutines-core",
    "kotlinx-coroutines-android",
    "kotlinx-serialization-json",
    "kotlinx-serialization-protobuf"
]
libsu = [
    "libsu-core",
    "libsu-service"
]

[plugins]
# 插件定义
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
